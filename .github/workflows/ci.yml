name: Cross-compile Rust

on:
  push:
    branches:
      - main # Or your main branch
      - develop # Or your development branch

jobs:
  build:
    runs-on: ubuntu-latest # Or other appropriate runner
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - uses: houseabsolute/actions-rust-cross@v1 # Or install cross separately
        with:
          target: ${{ matrix.target }}
          use-cross: true # Use cross for the build
      - name: Build for ${{ matrix.target }}
        run: cross build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: splistg-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/ # Adjust path to your binary
